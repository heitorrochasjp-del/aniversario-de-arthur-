<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Aniversário do Arthur</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        html, body { background: #000; overflow: hidden; width: 100vw; height: 100dvh; height: 100vh; touch-action: none; overscroll-behavior: none; }
        #game-container { width: 100%; height: 100%; position: relative; }
        #game-container canvas { display: block; margin: 0 auto; }
        #error-box { position: fixed; bottom: 0; left: 0; right: 0; background: #ff0000; color: #fff; padding: 15px; font-family: monospace; font-size: 14px; z-index: 99999; display: none; word-break: break-all; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="error-box"></div>

    <script>
        window.onerror = function(msg, url, line) {
            const box = document.getElementById('error-box');
            box.style.display = 'block';
            box.innerText = '❌ ERRO: ' + msg + ' (linha ' + line + ')';
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script>
        const GAME_WIDTH = 540;
        const GAME_HEIGHT = 960;

        // ==========================================
        // BOOT SCENE
        // ==========================================
        class BootScene extends Phaser.Scene {
            constructor() { super('BootScene'); }
            preload() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                this.add.text(width/2, height/2, 'CARREGANDO...', {
                    fontFamily: 'monospace', fontSize: '24px', fill: '#ffffff'
                }).setOrigin(0.5);

                this.load.image('foto_parado', 'foto-parado.jpeg');
                this.load.image('foto_andando', 'foto-andando.jpeg');
                this.load.image('foto_pulando', 'foto-pulando.jpeg');

                this.load.on('loaderror', (file) => {
                    const box = document.getElementById('error-box');
                    box.style.display = 'block';
                    box.innerText = '❌ FOTO NÃO ENCONTRADA: ' + file.src;
                });
            }
            create() {
                try {
                    this.criarTexturaCircular('foto_parado', 'arthur_parado');
                    this.criarTexturaCircular('foto_andando', 'arthur_andando');
                    this.criarTexturaCircular('foto_pulando', 'arthur_pulando');
                    this.scene.start('MenuScene');
                } catch (e) {
                    const box = document.getElementById('error-box');
                    box.style.display = 'block';
                    box.innerText = '❌ ERRO: ' + e.message;
                }
            }
            criarTexturaCircular(keyOriginal, keyNova) {
                if (!this.textures.exists(keyOriginal)) throw new Error('Textura não existe: ' + keyOriginal);
                const img = this.textures.get(keyOriginal).getSourceImage();
                const size = 64;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 16;
                tempCanvas.height = 16;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(img, 0, 0, 16, 16);
                ctx.save();
                ctx.beginPath();
                ctx.arc(size/2, size/2, size/2 - 2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(tempCanvas, 0, 0, size, size);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(size/2, size/2, size/2 - 2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                this.textures.addCanvas(keyNova, canvas);
            }
        }

        // ==========================================
        // MENU
        // ==========================================
        class MenuScene extends Phaser.Scene {
            constructor() { super('MenuScene'); }
            create() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const bg = this.add.graphics();
                bg.fillGradientStyle(0x5c94fc, 0x5c94fc, 0x9fd3ff, 0x9fd3ff, 1);
                bg.fillRect(0, 0, width, height);

                this.add.text(width/2, height * 0.12, 'ANIVERSÁRIO DO', {
                    fontFamily: 'monospace', fontSize: '22px', fill: '#ffffff',
                    stroke: '#000000', strokeThickness: 4
                }).setOrigin(0.5);

                this.add.text(width/2, height * 0.2, 'ARTHUR', {
                    fontFamily: 'monospace', fontSize: '52px', fill: '#ffd700',
                    stroke: '#000000', strokeThickness: 6
                }).setOrigin(0.5);

                const fotoMenu = this.add.image(width/2, height * 0.45, 'arthur_parado').setScale(2.5);
                this.tweens.add({ targets: fotoMenu, y: height * 0.45 - 10, duration: 1000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

                const btnStart = this.add.text(width/2, height * 0.7, '▶ COMEÇAR', {
                    fontFamily: 'monospace', fontSize: '28px', fill: '#ffffff',
                    backgroundColor: '#e24a4a', padding: { x: 25, y: 20 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                this.tweens.add({ targets: btnStart, scale: 1.1, duration: 500, yoyo: true, repeat: -1 });
                btnStart.on('pointerdown', () => { this.scene.start('GameScene'); });

                this.add.text(width/2, height * 0.87, 'Suba nas plataformas!', {
                    fontFamily: 'monospace', fontSize: '16px', fill: '#ffffff',
                    stroke: '#000000', strokeThickness: 3
                }).setOrigin(0.5);

                this.add.text(width/2, height * 0.92, '🔥 Cuidado com a lava! 🔥', {
                    fontFamily: 'monospace', fontSize: '14px', fill: '#ff6b6b',
                    stroke: '#000000', strokeThickness: 3
                }).setOrigin(0.5);

                this.add.text(width/2, height * 0.97, '◀ ▶ andar  •  ⬆ pular', {
                    fontFamily: 'monospace', fontSize: '12px', fill: '#ffffff',
                    stroke: '#000000', strokeThickness: 3
                }).setOrigin(0.5);
            }
        }

        // ==========================================
        // GAME SCENE
        // ==========================================
        class GameScene extends Phaser.Scene {
            constructor() { super('GameScene'); }
            create() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;

                this.score = 0;
                this.coinsCollected = 0;
                this.isGameOver = false;
                this.isWin = false;
                this.moveLeft = false;
                this.moveRight = false;
                this.jump = false;
                // ==========================================
                // LAVA 3x MAIS LENTA (era 0.35, agora 0.12)
                // ==========================================
                this.lavaVelocidade = 0.12;

                this.platforms = this.physics.add.staticGroup();
                this.coins = this.physics.add.group();
                this.enemies = this.physics.add.group();

                this.criarCenario(width, height);
                this.criarPlataformas(width, height);
                this.criarMoedas();
                this.criarInimigos();

                // Chão no fundo
                const ground = this.platforms.create(width/2, height - 40, null).setVisible(false);
                ground.body.setSize(width, 40);
                ground.setPosition(width/2, height - 40);

                // ==========================================
                // BONECO COMEÇA MAIS ALTO (era height - 100)
                // ==========================================
                this.player = this.physics.add.sprite(width/2, height - 250, 'arthur_parado');
                this.player.setBounce(0.1);
                this.player.setCollideWorldBounds(true);
                this.player.setScale(1.2);
                this.player.body.setSize(40, 40);
                this.player.body.setOffset(12, 12);

                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.collider(this.enemies, this.platforms);
                this.physics.add.collider(this.coins, this.platforms);
                this.physics.add.overlap(this.player, this.coins, this.coletarMoeda, null, this);
                this.physics.add.overlap(this.player, this.enemies, this.atingirInimigo, null, this);

                // Lava
                this.lava = this.add.rectangle(width/2, height + 200, width, 400, 0xff4500);
                this.physics.world.enable(this.lava);
                this.lava.body.setAllowGravity(false);
                this.lava.body.setImmovable(true);

                this.lavaGraphics = this.add.graphics();
                this.desenharLava(width, height);

                this.criarBandeira(width, height);

                this.physics.world.setBounds(0, 0, width, height);
                this.cameras.main.setBounds(0, 0, width, height);

                this.criarControlesTateis();
                this.cursors = this.input.keyboard.createCursorKeys();
                this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

                this.criarHUD();
            }

            criarCenario(width, height) {
                const sky = this.add.graphics();
                sky.fillGradientStyle(0x5c94fc, 0x5c94fc, 0x9fd3ff, 0x9fd3ff, 1);
                sky.fillRect(0, 0, width, height);

                for (let i = 0; i < 8; i++) {
                    const x = Phaser.Math.Between(50, width - 50);
                    const y = Phaser.Math.Between(80, height - 300);
                    this.desenharNuvem(x, y);
                }
            }

            desenharNuvem(x, y) {
                const g = this.add.graphics();
                g.fillStyle(0xffffff, 0.85);
                g.fillCircle(x, y, 18);
                g.fillCircle(x + 22, y - 8, 25);
                g.fillCircle(x + 48, y, 18);
                g.fillStyle(0xffffff, 1);
                g.fillCircle(x + 12, y + 4, 15);
                g.fillCircle(x + 38, y + 4, 15);
            }

            criarPlataformas(width, height) {
                const posicoes = [
                    { x: width * 0.25, y: height - 320 },
                    { x: width * 0.75, y: height - 440 },
                    { x: width * 0.3, y: height - 560 },
                    { x: width * 0.7, y: height - 680 },
                    { x: width * 0.25, y: height - 790 },
                    { x: width * 0.75, y: height - 890 },
                    { x: width * 0.35, y: height - 990 }
                ];

                posicoes.forEach(pos => {
                    const plat = this.platforms.create(pos.x, pos.y, null).setVisible(false);
                    plat.body.setSize(130, 25);
                    plat.setPosition(pos.x, pos.y);
                    this.desenharPlataforma(pos.x, pos.y);
                });
            }

            desenharPlataforma(x, y) {
                const g = this.add.graphics();
                g.fillStyle(0x8B4513, 1);
                g.fillRect(x - 65, y - 12, 130, 25);
                g.fillStyle(0x4ade80, 1);
                g.fillRect(x - 65, y - 12, 130, 7);
                g.lineStyle(2, 0x654321);
                for (let i = -65; i < 65; i += 32) {
                    g.strokeRect(x + i, y - 5, 32, 18);
                }
                g.lineStyle(2, 0x2e7d32);
                g.strokeRect(x - 65, y - 12, 130, 7);
            }

            criarMoedas() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const posicoesMoedas = [
                    { x: width * 0.25, y: height - 380 },
                    { x: width * 0.75, y: height - 500 },
                    { x: width * 0.3, y: height - 620 },
                    { x: width * 0.7, y: height - 740 },
                    { x: width * 0.25, y: height - 840 },
                    { x: width * 0.75, y: height - 950 }
                ];
                posicoesMoedas.forEach(pos => {
                    const coin = this.coins.create(pos.x, pos.y, null).setVisible(false);
                    coin.body.setSize(30, 30);
                    coin.setPosition(pos.x, pos.y);
                    const g = this.add.graphics();
                    g.fillStyle(0xffd700, 1);
                    g.fillCircle(pos.x, pos.y, 12);
                    g.fillStyle(0xffaa00, 1);
                    g.fillCircle(pos.x, pos.y, 8);
                    g.fillStyle(0xffd700, 1);
                    g.fillCircle(pos.x, pos.y, 4);
                    coin.graphics = g;
                });
            }

            criarInimigos() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const posicoes = [
                    { x: width * 0.75, y: height - 500, min: width * 0.6, max: width * 0.9 },
                    { x: width * 0.3, y: height - 620, min: width * 0.15, max: width * 0.45 },
                    { x: width * 0.7, y: height - 740, min: width * 0.55, max: width * 0.85 },
                    { x: width * 0.35, y: height - 930, min: width * 0.2, max: width * 0.5 }
                ];
                posicoes.forEach(pos => {
                    const enemy = this.enemies.create(pos.x, pos.y, null).setVisible(false);
                    enemy.body.setSize(35, 35);
                    enemy.setPosition(pos.x, pos.y);
                    enemy.setBounce(0);
                    enemy.minX = pos.min;
                    enemy.maxX = pos.max;
                    enemy.direction = 1;
                    enemy.speed = 50;
                    const g = this.add.graphics();
                    g.fillStyle(0x8B4513, 1);
                    g.fillRect(pos.x - 17, pos.y - 17, 35, 35);
                    g.fillStyle(0x654321, 1);
                    g.fillRect(pos.x - 15, pos.y - 15, 30, 30);
                    g.fillStyle(0xffffff, 1);
                    g.fillCircle(pos.x - 8, pos.y - 5, 6);
                    g.fillCircle(pos.x + 8, pos.y - 5, 6);
                    g.fillStyle(0x000000, 1);
                    g.fillCircle(pos.x - 6, pos.y - 5, 3);
                    g.fillCircle(pos.x + 10, pos.y - 5, 3);
                    enemy.graphics = g;
                });
            }

            criarBandeira(width, height) {
                this.bandeiraX = width * 0.35;
                this.bandeiraY = height - 990;

                const g = this.add.graphics();
                g.fillStyle(0xcccccc, 1);
                g.fillRect(this.bandeiraX, this.bandeiraY - 80, 8, 80);
                g.fillStyle(0xffd700, 1);
                g.fillTriangle(
                    this.bandeiraX + 8, this.bandeiraY - 80,
                    this.bandeiraX + 8, this.bandeiraY - 40,
                    this.bandeiraX + 60, this.bandeiraY - 60
                );
                g.fillStyle(0xffffff, 1);
                g.fillCircle(this.bandeiraX + 28, this.bandeiraY - 60, 6);
            }

            desenharLava(width, height) {
                this.lavaGraphics.clear();
                const lavaY = this.lava.y;
                this.lavaGraphics.fillStyle(0xffd700, 0.6);
                this.lavaGraphics.fillRect(0, lavaY - 200, width, 8);
                this.lavaGraphics.fillStyle(0xffaa00, 0.8);
                for (let x = 30; x < width; x += 80) {
                    this.lavaGraphics.fillCircle(x, lavaY - 160, 6);
                    this.lavaGraphics.fillCircle(x + 40, lavaY - 130, 5);
                }
            }

            criarControlesTateis() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const btnSize = 70;
                // ==========================================
                // MARGEM MAIOR EMBAIXO (era 10, agora 100)
                // ==========================================
                const marginSides = 15;
                const marginBottom = 100;

                // Esquerda
                this.btnLeft = this.add.circle(marginSides + btnSize/2, height - marginBottom - btnSize/2, btnSize/2, 0xffffff, 0.35).setScrollFactor(0).setDepth(1000);
                this.btnLeft.setInteractive({ useHandCursor: true });
                this.add.text(marginSides + btnSize/2, height - marginBottom - btnSize/2, '◀', { fontFamily: 'monospace', fontSize: '34px', fill: '#ffffff', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setScrollFactor(0).setDepth(1001);

                // Direita
                this.btnRight = this.add.circle(marginSides + btnSize + 10 + btnSize/2, height - marginBottom - btnSize/2, btnSize/2, 0xffffff, 0.35).setScrollFactor(0).setDepth(1000);
                this.btnRight.setInteractive({ useHandCursor: true });
                this.add.text(marginSides + btnSize + 10 + btnSize/2, height - marginBottom - btnSize/2, '▶', { fontFamily: 'monospace', fontSize: '34px', fill: '#ffffff', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setScrollFactor(0).setDepth(1001);

                // Pular
                this.btnJump = this.add.circle(width - marginSides - btnSize/2, height - marginBottom - btnSize/2, btnSize/2 + 5, 0xffd700, 0.5).setScrollFactor(0).setDepth(1000);
                this.btnJump.setInteractive({ useHandCursor: true });
                this.add.text(width - marginSides - btnSize/2, height - marginBottom - btnSize/2, '⬆', { fontFamily: 'monospace', fontSize: '40px', fill: '#ffffff', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setScrollFactor(0).setDepth(1001);

                // Eventos
                this.btnLeft.on('pointerdown', () => { this.moveLeft = true; this.btnLeft.setFillStyle(0xffffff, 0.7); });
                this.btnLeft.on('pointerup', () => { this.moveLeft = false; this.btnLeft.setFillStyle(0xffffff, 0.35); });
                this.btnLeft.on('pointerout', () => { this.moveLeft = false; this.btnLeft.setFillStyle(0xffffff, 0.35); });

                this.btnRight.on('pointerdown', () => { this.moveRight = true; this.btnRight.setFillStyle(0xffffff, 0.7); });
                this.btnRight.on('pointerup', () => { this.moveRight = false; this.btnRight.setFillStyle(0xffffff, 0.35); });
                this.btnRight.on('pointerout', () => { this.moveRight = false; this.btnRight.setFillStyle(0xffffff, 0.35); });

                this.btnJump.on('pointerdown', () => { this.jump = true; this.btnJump.setFillStyle(0xffd700, 0.8); });
                this.btnJump.on('pointerup', () => { this.jump = false; this.btnJump.setFillStyle(0xffd700, 0.5); });
                this.btnJump.on('pointerout', () => { this.jump = false; this.btnJump.setFillStyle(0xffd700, 0.5); });

                this.input.addPointer(3);
            }

            criarHUD() {
                const width = this.cameras.main.width;
                this.coinText = this.add.text(15, 15, '🪙 0', {
                    fontFamily: 'monospace', fontSize: '22px', fill: '#ffd700',
                    stroke: '#000000', strokeThickness: 4
                }).setScrollFactor(0).setDepth(2000);
                this.scoreText = this.add.text(width - 15, 15, 'PONTOS: 0', {
                    fontFamily: 'monospace', fontSize: '16px', fill: '#ffffff',
                    stroke: '#000000', strokeThickness: 4
                }).setOrigin(1, 0).setScrollFactor(0).setDepth(2000);
            }

            coletarMoeda(player, coin) {
                if (this.isGameOver || this.isWin) return;
                coin.destroy();
                if (coin.graphics) coin.graphics.destroy();
                this.coinsCollected++;
                this.score += 100;
                this.coinText.setText('🪙 ' + this.coinsCollected);
                this.scoreText.setText('PONTOS: ' + this.score);
            }

            atingirInimigo(player, enemy) {
                if (this.isGameOver || this.isWin) return;
                if (player.body.velocity.y > 0 && player.y < enemy.y - 15) {
                    enemy.destroy();
                    if (enemy.graphics) enemy.graphics.destroy();
                    player.setVelocityY(-400);
                    this.score += 200;
                    this.scoreText.setText('PONTOS: ' + this.score);
                } else {
                    this.gameOver('💀 GAME OVER 💀');
                }
            }

            gameOver(mensagem) {
                if (this.isGameOver) return;
                this.isGameOver = true;
                this.physics.pause();
                this.player.setTint(0xff0000);
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                this.add.text(width/2, height/2 - 40, mensagem, {
                    fontFamily: 'monospace', fontSize: '28px', fill: '#ff0000',
                    stroke: '#000000', strokeThickness: 6
                }).setOrigin(0.5).setScrollFactor(0).setDepth(3000);
                const btnRestart = this.add.text(width/2, height/2 + 50, '🔄 TENTAR NOVAMENTE', {
                    fontFamily: 'monospace', fontSize: '20px', fill: '#ffffff',
                    backgroundColor: '#e24a4a', padding: { x: 20, y: 15 }
                }).setOrigin(0.5).setScrollFactor(0).setDepth(3000).setInteractive();
                btnRestart.on('pointerdown', () => { this.scene.restart(); });
            }

            update() {
                if (this.isGameOver || this.isWin) return;

                const speed = 220;
                const jumpForce = -700;

                if (this.moveLeft || this.cursors.left.isDown) {
                    this.player.setVelocityX(-speed);
                    this.player.setFlipX(true);
                } else if (this.moveRight || this.cursors.right.isDown) {
                    this.player.setVelocityX(speed);
                    this.player.setFlipX(false);
                } else {
                    this.player.setVelocityX(0);
                }

                if ((this.jump || this.cursors.up.isDown || this.spaceKey.isDown) && this.player.body.touching.down) {
                    this.player.setVelocityY(jumpForce);
                }

                if (!this.player.body.touching.down) {
                    this.player.setTexture('arthur_pulando');
                } else if (this.moveLeft || this.moveRight || this.cursors.left.isDown || this.cursors.right.isDown) {
                    this.player.setTexture('arthur_andando');
                } else {
                    this.player.setTexture('arthur_parado');
                }

                // Lava sobe devagar
                this.lava.y -= this.lavaVelocidade;
                this.lava.body.updateFromGameObject();
                this.desenharLava(this.cameras.main.width, this.cameras.main.height);

                if (this.player.y + 20 > this.lava.y - 200) {
                    this.gameOver('🔥 A LAVA TE PEGOU! 🔥');
                }

                this.enemies.children.iterate(enemy => {
                    if (!enemy || !enemy.active) return;
                    if (enemy.x <= enemy.minX) enemy.direction = 1;
                    else if (enemy.x >= enemy.maxX) enemy.direction = -1;
                    enemy.setVelocityX(enemy.speed * enemy.direction);
                    if (enemy.graphics) enemy.graphics.setPosition(enemy.x - 17, enemy.y - 17);
                });

                this.coins.children.iterate(coin => {
                    if (coin && coin.active && coin.graphics) coin.graphics.setPosition(coin.x, coin.y);
                });

                if (this.player.y < this.bandeiraY - 20 && !this.isWin) {
                    this.isWin = true;
                    this.physics.pause();
                    this.player.setVelocity(0);
                    this.time.delayedCall(500, () => {
                        this.scene.start('WinScene', { score: this.score, coins: this.coinsCollected });
                    });
                }
            }
        }

        // ==========================================
        // WIN SCENE
        // ==========================================
        class WinScene extends Phaser.Scene {
            constructor() { super('WinScene'); }
            init(data) {
                this.finalScore = data.score || 0;
                this.finalCoins = data.coins || 0;
            }
            create() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const bg = this.add.graphics();
                bg.fillGradientStyle(0x1a1a2e, 0x1a1a2e, 0x16213e, 0x16213e, 1);
                bg.fillRect(0, 0, width, height);

                this.add.image(width/2, height * 0.42, 'arthur_parado').setScale(3);
                const moldura = this.add.graphics();
                moldura.lineStyle(8, 0xffd700, 1);
                moldura.strokeCircle(width/2, height * 0.42, 100);

                const titulo = this.add.text(width/2, height * 0.1, '🎉 FELIZ', {
                    fontFamily: 'monospace', fontSize: '26px', fill: '#ffd700',
                    stroke: '#000000', strokeThickness: 6
                }).setOrigin(0.5);

                const titulo2 = this.add.text(width/2, height * 0.16, 'ANIVERSÁRIO', {
                    fontFamily: 'monospace', fontSize: '26px', fill: '#ffd700',
                    stroke: '#000000', strokeThickness: 6
                }).setOrigin(0.5);

                const subtitulo = this.add.text(width/2, height * 0.24, 'ARTHUR!!! 🎉', {
                    fontFamily: 'monospace', fontSize: '32px', fill: '#ff6b6b',
                    stroke: '#000000', strokeThickness: 6
                }).setOrigin(0.5);

                this.tweens.add({ targets: [titulo, titulo2, subtitulo], scale: 1.1, duration: 600, yoyo: true, repeat: -1 });

                this.add.text(width/2, height * 0.64, `PONTOS: ${this.finalScore}`, {
                    fontFamily: 'monospace', fontSize: '20px', fill: '#ffffff',
                    stroke: '#000000', strokeThickness: 4
                }).setOrigin(0.5);

                this.add.text(width/2, height * 0.69, `🪙 ${this.finalCoins} moedas`, {
                    fontFamily: 'monospace', fontSize: '18px', fill: '#ffd700',
                    stroke: '#000000', strokeThickness: 4
                }).setOrigin(0.5);

                const btnRestart = this.add.text(width/2, height * 0.84, '🔁 JOGAR NOVAMENTE', {
                    fontFamily: 'monospace', fontSize: '20px', fill: '#ffffff',
                    backgroundColor: '#e24a4a', padding: { x: 22, y: 15 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                btnRestart.on('pointerdown', () => { this.scene.start('MenuScene'); });

                this.criarConfetes(width, height);
                this.criarBaloes(width, height);
            }

            criarConfetes(width, height) {
                const cores = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff8b94];
                for (let i = 0; i < 60; i++) {
                    const x = Phaser.Math.Between(0, width);
                    const y = Phaser.Math.Between(-height, 0);
                    const cor = cores[Phaser.Math.Between(0, cores.length - 1)];
                    const confete = this.add.rectangle(x, y, 8, 8, cor);
                    this.tweens.add({ targets: confete, y: height + 20, duration: Phaser.Math.Between(3000, 6000), repeat: -1, delay: Phaser.Math.Between(0, 2000) });
                }
            }

            criarBaloes(width, height) {
                const cores = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff8b94];
                for (let i = 0; i < 8; i++) {
                    const x = Phaser.Math.Between(40, width - 40);
                    const cor = cores[Phaser.Math.Between(0, cores.length - 1)];
                    const balao = this.add.circle(x, height + 50, 18, cor);
                    balao.setAlpha(0.85);
                    this.tweens.add({ targets: balao, y: -100, duration: Phaser.Math.Between(4000, 8000), repeat: -1, delay: Phaser.Math.Between(0, 3000) });
                }
            }
        }

        // ==========================================
        // CONFIG FINAL
        // ==========================================
        const config = {
            type: Phaser.CANVAS,
            width: GAME_WIDTH,
            height: GAME_HEIGHT,
            parent: 'game-container',
            backgroundColor: '#5c94fc',
            pixelArt: false,
            roundPixels: true,
            disableContextMenu: true,
            input: { activePointers: 4 },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                orientation: Phaser.Scale.PORTRAIT
            },
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 1200 }, debug: false }
            },
            scene: [BootScene, MenuScene, GameScene, WinScene]
        };

        window.addEventListener('load', () => {
            try {
                const game = new Phaser.Game(config);
            } catch (e) {
                const box = document.getElementById('error-box');
                box.style.display = 'block';
                box.innerText = '❌ ERRO: ' + e.message;
            }
        });

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
