<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Aniversário do Arthur</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        html, body { background: #000; overflow: hidden; width: 100vw; height: 100dvh; height: 100vh; touch-action: none; overscroll-behavior: none; }
        #game-container { width: 100%; height: 100%; position: relative; }
        #game-container canvas { display: block; width: 100% !important; height: 100% !important; }
        #rotate-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e; color: #fff; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; text-align: center; padding: 20px; font-family: monospace; }
        #rotate-overlay .icon { font-size: 60px; margin-bottom: 20px; animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(90deg); } }
        #rotate-overlay p { font-size: 16px; line-height: 1.5; }
        #error-box { position: fixed; bottom: 0; left: 0; right: 0; background: #ff0000; color: #fff; padding: 15px; font-family: monospace; font-size: 14px; z-index: 99999; display: none; word-break: break-all; }
    </style>
</head>
<body>
    <div id="rotate-overlay">
        <div class="icon">🔄</div>
        <p>Vire o celular na horizontal<br>para jogar!</p>
    </div>
    <div id="game-container"></div>
    <div id="error-box"></div>

    <script>
        window.onerror = function(msg, url, line) {
            const box = document.getElementById('error-box');
            box.style.display = 'block';
            box.innerText = '❌ ERRO: ' + msg + ' (linha ' + line + ')';
        };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script>
        const GAME_WIDTH = 960;
        const GAME_HEIGHT = 540;
        const MAP_WIDTH = GAME_WIDTH * 3; // Mapa mais longo (3x a tela)

        // ==========================================
        // BOOT SCENE
        // ==========================================
        class BootScene extends Phaser.Scene {
            constructor() { super('BootScene'); }
            preload() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                this.add.text(width/2, height/2, 'CARREGANDO...', {
                    fontFamily: 'monospace', fontSize: '24px', fill: '#ffffff'
                }).setOrigin(0.5);

                this.load.image('foto_parado', 'foto-parado.jpeg');
                this.load.image('foto_andando', 'foto-andando.jpeg');
                this.load.image('foto_pulando', 'foto-pulando.jpeg');

                this.load.on('loaderror', (file) => {
                    const box = document.getElementById('error-box');
                    box.style.display = 'block';
                    box.innerText = '❌ FOTO NÃO ENCONTRADA: ' + file.src;
                });
            }
            create() {
                try {
                    this.criarTexturaCircular('foto_parado', 'arthur_parado');
                    this.criarTexturaCircular('foto_andando', 'arthur_andando');
                    this.criarTexturaCircular('foto_pulando', 'arthur_pulando');
                    this.scene.start('MenuScene');
                } catch (e) {
                    const box = document.getElementById('error-box');
                    box.style.display = 'block';
                    box.innerText = '❌ ERRO: ' + e.message;
                }
            }
            criarTexturaCircular(keyOriginal, keyNova) {
                if (!this.textures.exists(keyOriginal)) {
                    throw new Error('Textura não existe: ' + keyOriginal);
                }
                const img = this.textures.get(keyOriginal).getSourceImage();
                const size = 64;
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 16;
                tempCanvas.height = 16;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(img, 0, 0, 16, 16);
                ctx.save();
                ctx.beginPath();
                ctx.arc(size/2, size/2, size/2 - 2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(tempCanvas, 0, 0, size, size);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(size/2, size/2, size/2 - 2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
                this.textures.addCanvas(keyNova, canvas);
            }
        }

        // ==========================================
        // MENU
        // ==========================================
        class MenuScene extends Phaser.Scene {
            constructor() { super('MenuScene'); }
            create() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const bg = this.add.graphics();
                bg.fillGradientStyle(0x5c94fc, 0x5c94fc, 0x87ceeb, 0x87ceeb, 1);
                bg.fillRect(0, 0, width, height);

                this.add.image(100, 80, 'arthur_parado').setScale(0.5).setAlpha(0.3);
                this.add.image(800, 120, 'arthur_andando').setScale(0.5).setAlpha(0.3);

                this.add.text(width/2, height * 0.2, 'ANIVERSÁRIO DO', {
                    fontFamily: 'monospace', fontSize: '28px', fill: '#ffffff',
                    stroke: '#000000', strokeThickness: 4
                }).setOrigin(0.5);

                this.add.text(width/2, height * 0.3, 'ARTHUR', {
                    fontFamily: 'monospace', fontSize: '64px', fill: '#ffd700',
                    stroke: '#000000', strokeThickness: 6
                }).setOrigin(0.5);

                const fotoMenu = this.add.image(width/2, height * 0.55, 'arthur_parado').setScale(2);
                this.tweens.add({ targets: fotoMenu, y: height * 0.55 - 10, duration: 1000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

                const btnStart = this.add.text(width/2, height * 0.8, '▶ COMEÇAR', {
                    fontFamily: 'monospace', fontSize: '32px', fill: '#ffffff',
                    backgroundColor: '#e24a4a', padding: { x: 25, y: 20 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                this.tweens.add({ targets: btnStart, scale: 1.1, duration: 500, yoyo: true, repeat: -1 });

                btnStart.on('pointerdown', () => { this.scene.start('GameScene'); });

                this.add.text(width/2, height * 0.93, '◀ ▶ para andar  •  ⬆ para pular', {
                    fontFamily: 'monospace', fontSize: '14px', fill: '#ffffff',
                    stroke: '#000000', strokeThickness: 3
                }).setOrigin(0.5);
            }
        }

        // ==========================================
        // GAME SCENE
        // ==========================================
        class GameScene extends Phaser.Scene {
            constructor() { super('GameScene'); }
            create() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;

                this.score = 0;
                this.coinsCollected = 0;
                this.isGameOver = false;
                this.isWin = false;
                this.moveLeft = false;
                this.moveRight = false;
                this.jump = false;
                this.lavaAtiva = false;       // lava ainda desligada
                this.chaoGraphics = null;      // guarda o desenho do chão

                this.platforms = this.physics.add.staticGroup();
                this.coins = this.physics.add.group();
                this.enemies = this.physics.add.group();

                this.criarCenario(width, height);
                this.criarPlataformas(width, height);
                this.criarMoedas();
                this.criarInimigos();

                this.player = this.physics.add.sprite(100, height - 150, 'arthur_parado');
                this.player.setBounce(0.1);
                this.player.setCollideWorldBounds(true);
                this.player.setScale(1.2);
                this.player.body.setSize(40, 40);
                this.player.body.setOffset(12, 12);

                this.physics.add.collider(this.player, this.platforms);
                this.physics.add.collider(this.enemies, this.platforms);
                this.physics.add.collider(this.coins, this.platforms);
                this.physics.add.overlap(this.player, this.coins, this.coletarMoeda, null, this);
                this.physics.add.overlap(this.player, this.enemies, this.atingirInimigo, null, this);

                // Zona de lava (só ativa depois que ele pisa na 1ª plataforma)
                this.lavaZone = this.add.zone(MAP_WIDTH/2, height - 20, MAP_WIDTH, 40);
                this.physics.world.enable(this.lavaZone);
                this.lavaZone.body.setAllowGravity(false);
                this.lavaZone.body.setImmovable(true);
                this.physics.add.overlap(this.player, this.lavaZone, this.cairNaLava, null, this);

                this.criarBandeira(width);

                this.cameras.main.setBounds(0, 0, MAP_WIDTH, height);
                this.physics.world.setBounds(0, 0, MAP_WIDTH, height);
                this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

                this.criarControlesTateis();
                this.cursors = this.input.keyboard.createCursorKeys();
                this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

                this.criarHUD();
            }

            criarCenario(width, height) {
                // Céu
                const sky = this.add.graphics();
                sky.fillGradientStyle(0x5c94fc, 0x5c94fc, 0x9fd3ff, 0x9fd3ff, 1);
                sky.fillRect(0, 0, MAP_WIDTH, height);

                // Chão (vai ser substituído por lava depois)
                this.chaoGraphics = this.add.graphics();
                this.desenharChaoNormal(this.chaoGraphics, height);

                // Nuvens em fileira por todo o mapa
                for (let i = 0; i < 24; i++) {
                    const cloudX = 100 + i * 120;
                    const cloudY = 80 + (i % 3) * 30;
                    this.desenharNuvem(cloudX, cloudY);
                }

                // Arbustos espalhados
                for (let x = 150; x < MAP_WIDTH - 100; x += 300) {
                    this.desenharArbusto(x, height - 80);
                }
            }

            desenharChaoNormal(g, height) {
                g.clear();
                // Grama em cima
                g.fillStyle(0x4ade80, 1);
                g.fillRect(0, height - 80, MAP_WIDTH, 20);
                // Terra embaixo
                g.fillStyle(0x8B4513, 1);
                g.fillRect(0, height - 60, MAP_WIDTH, 60);
                // Tijolos
                g.lineStyle(2, 0x654321);
                for (let x = 0; x < MAP_WIDTH; x += 40) {
                    g.strokeRect(x, height - 60, 40, 30);
                    g.strokeRect(x + 20, height - 30, 40, 30);
                }
            }

            desenharChaoLava(g, height) {
                g.clear();
                // Lava brilhante
                g.fillStyle(0xff4500, 1);
                g.fillRect(0, height - 80, MAP_WIDTH, 80);
                // Camada de lava mais clara
                g.fillStyle(0xff6347, 1);
                g.fillRect(0, height - 80, MAP_WIDTH, 15);
                // Bolhas de lava (aleatórias mas fixas)
                g.fillStyle(0xffaa00, 1);
                for (let x = 30; x < MAP_WIDTH; x += 90) {
                    g.fillCircle(x, height - 60, 8);
                    g.fillCircle(x + 40, height - 40, 6);
                    g.fillCircle(x + 20, height - 25, 5);
                }
                // Brilho laranja por cima
                g.fillStyle(0xffd700, 0.4);
                g.fillRect(0, height - 80, MAP_WIDTH, 5);
            }

            ativarLava() {
                if (this.lavaAtiva) return;
                this.lavaAtiva = true;
                this.desenharChaoLava(this.chaoGraphics, this.cameras.main.height);

                // Aviso piscando
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const aviso = this.add.text(width/2, height * 0.4, '🔥 A LAVA SUBIU! 🔥', {
                    fontFamily: 'monospace', fontSize: '48px', fill: '#ff4500',
                    stroke: '#000000', strokeThickness: 6
                }).setOrigin(0.5).setScrollFactor(0).setDepth(500);

                this.tweens.add({
                    targets: aviso,
                    alpha: 0,
                    scale: 1.5,
                    duration: 1500,
                    onComplete: () => aviso.destroy()
                });
            }

            desenharNuvem(x, y) {
                const g = this.add.graphics();
                g.fillStyle(0xffffff, 0.9);
                g.fillCircle(x, y, 25);
                g.fillCircle(x + 30, y - 10, 35);
                g.fillCircle(x + 65, y, 25);
                g.fillStyle(0xffffff, 1);
                g.fillCircle(x + 15, y + 5, 20);
                g.fillCircle(x + 50, y + 5, 20);
            }

            desenharArbusto(x, y) {
                const g = this.add.graphics();
                g.fillStyle(0x228B22, 1);
                g.fillCircle(x, y, 25);
                g.fillCircle(x + 25, y - 15, 30);
                g.fillCircle(x + 50, y, 25);
                g.fillStyle(0x2e7d32, 1);
                g.fillCircle(x + 25, y + 5, 20);
            }

            criarPlataformas(width, height) {
                // Chão sólido (só a primeira parte — depois vira lava)
                const ground = this.platforms.create(MAP_WIDTH/2, height - 20, null).setVisible(false);
                ground.body.setSize(MAP_WIDTH, 40);
                ground.setPosition(MAP_WIDTH/2, height - 20);

                // Plataformas — percurso longo e escalonado
                const posicoes = [
                    // Primeira plataforma (ativa a lava)
                    { x: 350, y: height - 180, ativaLava: true },
                    // Restante do percurso
                    { x: 550, y: height - 260 },
                    { x: 750, y: height - 180 },
                    { x: 950, y: height - 280 },
                    { x: 1150, y: height - 200 },
                    { x: 1350, y: height - 300 },
                    { x: 1550, y: height - 220 },
                    { x: 1750, y: height - 180 },
                    { x: 1950, y: height - 280 },
                    { x: 2150, y: height - 200 },
                    { x: 2350, y: height - 260 },
                    { x: 2550, y: height - 180 },
                    { x: 2750, y: height - 240 }
                ];

                posicoes.forEach(pos => {
                    const plat = this.platforms.create(pos.x, pos.y, null).setVisible(false);
                    plat.body.setSize(120, 30);
                    plat.setPosition(pos.x, pos.y);
                    plat.ativaLava = pos.ativaLava || false;
                    this.desenharPlataforma(pos.x, pos.y);
                });
            }

            desenharPlataforma(x, y) {
                const g = this.add.graphics();
                g.fillStyle(0x8B4513, 1);
                g.fillRect(x - 60, y - 15, 120, 30);
                g.fillStyle(0x4ade80, 1);
                g.fillRect(x - 60, y - 15, 120, 8);
                g.lineStyle(2, 0x654321);
                for (let i = -60; i < 60; i += 30) {
                    g.strokeRect(x + i, y - 7, 30, 22);
                }
                g.lineStyle(2, 0x2e7d32);
                g.strokeRect(x - 60, y - 15, 120, 8);
            }

            criarMoedas() {
                const posicoesMoedas = [
                    // Moedas ao longo do percurso
                    { x: 350, y: 300 }, { x: 380, y: 300 },
                    { x: 550, y: 220 },
                    { x: 750, y: 300 }, { x: 780, y: 300 },
                    { x: 950, y: 200 },
                    { x: 1150, y: 280 }, { x: 1180, y: 280 },
                    { x: 1350, y: 180 },
                    { x: 1550, y: 260 },
                    { x: 1750, y: 300 }, { x: 1780, y: 300 },
                    { x: 1950, y: 200 },
                    { x: 2150, y: 280 },
                    { x: 2350, y: 220 }, { x: 2380, y: 220 },
                    { x: 2550, y: 300 },
                    { x: 2750, y: 240 }
                ];
                posicoesMoedas.forEach(pos => {
                    const coin = this.coins.create(pos.x, pos.y, null).setVisible(false);
                    coin.body.setSize(30, 30);
                    coin.setPosition(pos.x, pos.y);
                    const g = this.add.graphics();
                    g.fillStyle(0xffd700, 1);
                    g.fillCircle(pos.x, pos.y, 12);
                    g.fillStyle(0xffaa00, 1);
                    g.fillCircle(pos.x, pos.y, 8);
                    g.fillStyle(0xffd700, 1);
                    g.fillCircle(pos.x, pos.y, 4);
                    coin.graphics = g;
                });
            }

            criarInimigos() {
                const posicoesInimigos = [
                    { x: 600, y: 400, min: 550, max: 650 },
                    { x: 1000, y: 400, min: 950, max: 1100 },
                    { x: 1500, y: 400, min: 1450, max: 1600 },
                    { x: 2000, y: 400, min: 1950, max: 2100 },
                    { x: 2400, y: 400, min: 2350, max: 2500 },
                    { x: 2700, y: 400, min: 2650, max: 2800 }
                ];
                posicoesInimigos.forEach(pos => {
                    const enemy = this.enemies.create(pos.x, pos.y, null).setVisible(false);
                    enemy.body.setSize(35, 35);
                    enemy.setPosition(pos.x, pos.y);
                    enemy.setBounce(0);
                    enemy.setCollideWorldBounds(true);
                    enemy.minX = pos.min;
                    enemy.maxX = pos.max;
                    enemy.direction = 1;
                    enemy.speed = 60;
                    const g = this.add.graphics();
                    g.fillStyle(0x8B4513, 1);
                    g.fillRect(pos.x - 17, pos.y - 17, 35, 35);
                    g.fillStyle(0x654321, 1);
                    g.fillRect(pos.x - 15, pos.y - 15, 30, 30);
                    g.fillStyle(0xffffff, 1);
                    g.fillCircle(pos.x - 8, pos.y - 5, 6);
                    g.fillCircle(pos.x + 8, pos.y - 5, 6);
                    g.fillStyle(0x000000, 1);
                    g.fillCircle(pos.x - 6, pos.y - 5, 3);
                    g.fillCircle(pos.x + 10, pos.y - 5, 3);
                    enemy.graphics = g;
                });
            }

            criarBandeira(width) {
                this.bandeiraX = MAP_WIDTH - 150;
                this.bandeiraY = 400;
                const g = this.add.graphics();
                g.fillStyle(0xcccccc, 1);
                g.fillRect(this.bandeiraX, this.bandeiraY - 150, 10, 150);
                g.fillStyle(0xffd700, 1);
                g.fillTriangle(this.bandeiraX + 10, this.bandeiraY - 150, this.bandeiraX + 10, this.bandeiraY - 100, this.bandeiraX + 80, this.bandeiraY - 125);
                g.fillStyle(0xffffff, 1);
                g.fillCircle(this.bandeiraX + 35, this.bandeiraY - 125, 8);

                // Plataforma da bandeira
                const plat = this.platforms.create(this.bandeiraX + 20, this.bandeiraY, null).setVisible(false);
                plat.body.setSize(120, 30);
                plat.setPosition(this.bandeiraX + 20, this.bandeiraY);
                this.desenharPlataforma(this.bandeiraX + 20, this.bandeiraY);
            }

            criarControlesTateis() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const btnSize = 90;
                const margin = 15;

                this.btnLeft = this.add.circle(margin + btnSize/2, height - margin - btnSize/2, btnSize/2, 0xffffff, 0.3).setScrollFactor(0).setDepth(100);
                this.btnLeft.setInteractive({ useHandCursor: true });
                this.add.text(margin + btnSize/2, height - margin - btnSize/2, '◀', { fontFamily: 'monospace', fontSize: '40px', fill: '#ffffff' }).setOrigin(0.5).setScrollFactor(0).setDepth(101);

                this.btnRight = this.add.circle(margin + btnSize + 10 + btnSize/2, height - margin - btnSize/2, btnSize/2, 0xffffff, 0.3).setScrollFactor(0).setDepth(100);
                this.btnRight.setInteractive({ useHandCursor: true });
                this.add.text(margin + btnSize + 10 + btnSize/2, height - margin - btnSize/2, '▶', { fontFamily: 'monospace', fontSize: '40px', fill: '#ffffff' }).setOrigin(0.5).setScrollFactor(0).setDepth(101);

                this.btnJump = this.add.circle(width - margin - btnSize/2, height - margin - btnSize/2, btnSize/2 + 10, 0xffd700, 0.4).setScrollFactor(0).setDepth(100);
                this.btnJump.setInteractive({ useHandCursor: true });
                this.add.text(width - margin - btnSize/2, height - margin - btnSize/2, '⬆', { fontFamily: 'monospace', fontSize: '48px', fill: '#ffffff' }).setOrigin(0.5).setScrollFactor(0).setDepth(101);

                this.btnLeft.on('pointerdown', () => { this.moveLeft = true; this.btnLeft.setFillStyle(0xffffff, 0.6); });
                this.btnLeft.on('pointerup', () => { this.moveLeft = false; this.btnLeft.setFillStyle(0xffffff, 0.3); });
                this.btnLeft.on('pointerout', () => { this.moveLeft = false; this.btnLeft.setFillStyle(0xffffff, 0.3); });

                this.btnRight.on('pointerdown', () => { this.moveRight = true; this.btnRight.setFillStyle(0xffffff, 0.6); });
                this.btnRight.on('pointerup', () => { this.moveRight = false; this.btnRight.setFillStyle(0xffffff, 0.3); });
                this.btnRight.on('pointerout', () => { this.moveRight = false; this.btnRight.setFillStyle(0xffffff, 0.3); });

                this.btnJump.on('pointerdown', () => { this.jump = true; this.btnJump.setFillStyle(0xffd700, 0.7); });
                this.btnJump.on('pointerup', () => { this.jump = false; this.btnJump.setFillStyle(0xffd700, 0.4); });
                this.btnJump.on('pointerout', () => { this.jump = false; this.btnJump.setFillStyle(0xffd700, 0.4); });

                this.input.addPointer(3);
            }

            criarHUD() {
                const width = this.cameras.main.width;
                this.coinText = this.add.text(20, 20, '🪙 0', { fontFamily: 'monospace', fontSize: '24px', fill: '#ffd700', stroke: '#000000', strokeThickness: 4 }).setScrollFactor(0).setDepth(200);
                this.scoreText = this.add.text(width - 20, 20, 'PONTOS: 0', { fontFamily: 'monospace', fontSize: '20px', fill: '#ffffff', stroke: '#000000', strokeThickness: 4 }).setOrigin(1, 0).setScrollFactor(0).setDepth(200);
            }

            coletarMoeda(player, coin) {
                if (this.isGameOver || this.isWin) return;
                coin.destroy();
                if (coin.graphics) coin.graphics.destroy();
                this.coinsCollected++;
                this.score += 100;
                this.coinText.setText('🪙 ' + this.coinsCollected);
                this.scoreText.setText('PONTOS: ' + this.score);
            }

            cairNaLava(player, lava) {
                if (this.isGameOver || this.isWin) return;
                if (!this.lavaAtiva) return; // lava não ativou ainda
                // Só mata se o jogador estiver no chão (não pulando)
                if (player.body.touching.down) {
                    this.gameOver('🔥 VOCÊ CAIU NA LAVA! 🔥');
                }
            }

            atingirInimigo(player, enemy) {
                if (this.isGameOver || this.isWin) return;
                if (player.body.velocity.y > 0 && player.y < enemy.y - 20) {
                    enemy.destroy();
                    if (enemy.graphics) enemy.graphics.destroy();
                    player.setVelocityY(-400);
                    this.score += 200;
                    this.scoreText.setText('PONTOS: ' + this.score);
                } else {
                    this.gameOver('💀 GAME OVER 💀');
                }
            }

            gameOver(mensagem) {
                this.isGameOver = true;
                this.physics.pause();
                this.player.setTint(0xff0000);
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                this.add.text(width/2, height/2 - 30, mensagem, { fontFamily: 'monospace', fontSize: '32px', fill: '#ff0000', stroke: '#000000', strokeThickness: 6 }).setOrigin(0.5).setScrollFactor(0).setDepth(300);
                const btnRestart = this.add.text(width/2, height/2 + 60, '🔄 TENTAR NOVAMENTE', { fontFamily: 'monospace', fontSize: '24px', fill: '#ffffff', backgroundColor: '#e24a4a', padding: { x: 20, y: 15 } }).setOrigin(0.5).setScrollFactor(0).setDepth(300).setInteractive();
                btnRestart.on('pointerdown', () => { this.scene.restart(); });
            }

            update() {
                if (this.isGameOver || this.isWin) return;

                const speed = 220;
                const jumpForce = -720;

                if (this.moveLeft || this.cursors.left.isDown) {
                    this.player.setVelocityX(-speed);
                    this.player.setFlipX(true);
                } else if (this.moveRight || this.cursors.right.isDown) {
                    this.player.setVelocityX(speed);
                    this.player.setFlipX(false);
                } else {
                    this.player.setVelocityX(0);
                }

                if ((this.jump || this.cursors.up.isDown || this.spaceKey.isDown) && this.player.body.touching.down) {
                    this.player.setVelocityY(jumpForce);
                }

                // Sprite
                if (!this.player.body.touching.down) {
                    this.player.setTexture('arthur_pulando');
                } else if (this.moveLeft || this.moveRight || this.cursors.left.isDown || this.cursors.right.isDown) {
                    this.player.setTexture('arthur_andando');
                } else {
                    this.player.setTexture('arthur_parado');
                }

                // ==================================================
                // ATIVA A LAVA quando ele pisa na 1ª plataforma
                // (detecta se o player está em cima de alguma plataforma)
                // ==================================================
                if (!this.lavaAtiva) {
                    this.platforms.children.iterate(plat => {
                        if (plat && plat.active && plat.ativaLava) {
                            const dx = Math.abs(this.player.x - plat.x);
                            const dy = this.player.y - plat.y;
                            // Se está em cima da plataforma (perto em X, acima em Y)
                            if (dx < 80 && dy > -30 && dy < 30 && this.player.body.touching.down) {
                                this.ativarLava();
                            }
                        }
                    });
                }

                this.enemies.children.iterate(enemy => {
                    if (!enemy || !enemy.active) return;
                    if (enemy.x <= enemy.minX) enemy.direction = 1;
                    else if (enemy.x >= enemy.maxX) enemy.direction = -1;
                    enemy.setVelocityX(enemy.speed * enemy.direction);
                    if (enemy.graphics) enemy.graphics.setPosition(enemy.x - 17, enemy.y - 17);
                });

                this.coins.children.iterate(coin => {
                    if (coin && coin.active && coin.graphics) coin.graphics.setPosition(coin.x, coin.y);
                });

                if (this.player.x > this.bandeiraX - 30 && !this.isWin) {
                    this.isWin = true;
                    this.physics.pause();
                    this.player.setVelocity(0);
                    this.time.delayedCall(500, () => {
                        this.scene.start('WinScene', { score: this.score, coins: this.coinsCollected });
                    });
                }
            }
        }

        // ==========================================
        // WIN SCENE
        // ==========================================
        class WinScene extends Phaser.Scene {
            constructor() { super('WinScene'); }
            init(data) {
                this.finalScore = data.score || 0;
                this.finalCoins = data.coins || 0;
            }
            create() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;
                const bg = this.add.graphics();
                bg.fillGradientStyle(0x1a1a2e, 0x1a1a2e, 0x16213e, 0x16213e, 1);
                bg.fillRect(0, 0, width, height);

                this.add.image(width/2, height * 0.4, 'arthur_parado').setScale(3);
                const moldura = this.add.graphics();
                moldura.lineStyle(8, 0xffd700, 1);
                moldura.strokeCircle(width/2, height * 0.4, 100);

                const titulo = this.add.text(width/2, height * 0.15, '🎉 FELIZ ANIVERSÁRIO', {
                    fontFamily: 'monospace', fontSize: '32px', fill: '#ffd700',
                    stroke: '#000000', strokeThickness: 6, align: 'center'
                }).setOrigin(0.5);

                const subtitulo = this.add.text(width/2, height * 0.25, 'ARTHUR!!! 🎉', {
                    fontFamily: 'monospace', fontSize: '44px', fill: '#ff6b6b',
                    stroke: '#000000', strokeThickness: 6, align: 'center'
                }).setOrigin(0.5);

                this.tweens.add({ targets: [titulo, subtitulo], scale: 1.1, duration: 600, yoyo: true, repeat: -1 });

                this.add.text(width/2, height * 0.62, `PONTOS: ${this.finalScore}  •  🪙 ${this.finalCoins}`, {
                    fontFamily: 'monospace', fontSize: '20px', fill: '#ffffff',
                    stroke: '#000000', strokeThickness: 4
                }).setOrigin(0.5);

                const btnRestart = this.add.text(width/2, height * 0.85, '🔁 JOGAR NOVAMENTE', {
                    fontFamily: 'monospace', fontSize: '24px', fill: '#ffffff',
                    backgroundColor: '#e24a4a', padding: { x: 25, y: 15 }
                }).setOrigin(0.5).setInteractive({ useHandCursor: true });

                btnRestart.on('pointerdown', () => { this.scene.start('MenuScene'); });

                this.criarConfetes(width, height);
                this.criarBaloes(width, height);
            }

            criarConfetes(width, height) {
                const cores = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff8b94];
                for (let i = 0; i < 60; i++) {
                    const x = Phaser.Math.Between(0, width);
                    const y = Phaser.Math.Between(-height, 0);
                    const cor = cores[Phaser.Math.Between(0, cores.length - 1)];
                    const confete = this.add.rectangle(x, y, 8, 8, cor);
                    this.tweens.add({ targets: confete, y: height + 20, duration: Phaser.Math.Between(3000, 6000), repeat: -1, delay: Phaser.Math.Between(0, 2000) });
                }
            }

            criarBaloes(width, height) {
                const cores = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa8e6cf, 0xff8b94];
                for (let i = 0; i < 8; i++) {
                    const x = Phaser.Math.Between(50, width - 50);
                    const cor = cores[Phaser.Math.Between(0, cores.length - 1)];
                    const balao = this.add.circle(x, height + 50, 20, cor);
                    balao.setAlpha(0.8);
                    this.tweens.add({ targets: balao, y: -100, duration: Phaser.Math.Between(4000, 8000), repeat: -1, delay: Phaser.Math.Between(0, 3000) });
                }
            }
        }

        // ==========================================
        // CONFIG FINAL
        // ==========================================
        const config = {
            type: Phaser.CANVAS,
            width: GAME_WIDTH,
            height: GAME_HEIGHT,
            parent: 'game-container',
            backgroundColor: '#5c94fc',
            pixelArt: false,
            roundPixels: true,
            disableContextMenu: true,
            input: { activePointers: 4 },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                orientation: Phaser.Scale.LANDSCAPE
            },
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 1200 }, debug: false }
            },
            scene: [BootScene, MenuScene, GameScene, WinScene]
        };

        window.addEventListener('load', () => {
            try {
                const game = new Phaser.Game(config);
            } catch (e) {
                const box = document.getElementById('error-box');
                box.style.display = 'block';
                box.innerText = '❌ ERRO: ' + e.message;
            }
        });

        // ==========================================
        // ORIENTAÇÃO
        // ==========================================
        function checkOrientation() {
            const overlay = document.getElementById('rotate-overlay');
            const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (isTouchDevice && window.innerHeight > window.innerWidth) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', () => { setTimeout(checkOrientation, 200); });
        checkOrientation();

        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
